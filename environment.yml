name: spun
channels:
  - conda-forge
dependencies:
  - python=3.11
  # --- core scientific stack ---
  - numpy>=2
  - scipy
  - pandas
  - pyarrow
  - fastparquet
  - scikit-learn
  - matplotlib
  - seaborn
  - tqdm
  - pillow
  - imageio
  # --- deep learning ---
  # conda-forge pytorch installs a CPU build by default on all platforms;
  # see README note for installing a CUDA build on Linux/Windows.
  # NOTE: conda-forge has no Windows builds of pytorch < 2.5, so we use a
  # lower bound rather than pinning the exact training version (2.4).
  - pytorch>=2.4
  - torchvision
  - pytorch-lightning
  - torchmetrics
  - torchgeo>=0.7
  # explicit for documentation; also pulled in by torchgeo:
  - segmentation-models-pytorch
  - timm
  - kornia
  - albumentations
  # albucore (albumentations' backend) imports these at runtime but the
  # conda-forge package doesn't declare them, so list them explicitly:
  - simsimd
  - stringzilla
  # graphviz provides the `dot` executable needed by torchviz:
  - graphviz
  # --- geospatial ---
  - rasterio
  - rioxarray
  - xarray
  - zarr
  - geopandas
  - shapely
  - pyproj
  - earthengine-api
  - geemap
  # --- notebooks ---
  - jupyterlab
  - ipykernel
  - ipywidgets
  - pip
  - pip:
      - wandb
      - weave
      - torchinfo
      - torchview
      - torchviz
      - graphviz
      - tartes
      - simsimd
      - stringzilla